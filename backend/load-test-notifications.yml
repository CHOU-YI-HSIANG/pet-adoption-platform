# Artillery Load Test Configuration for Notification System
# Tests API endpoints and Socket.IO under load

config:
  target: "http://localhost:5000"
  phases:
    # Phase 1: Warm-up - 漸進增加負載
    - duration: 60
      arrivalRate: 10
      name: "Warm-up - 10 users/sec"
    # Phase 2: Load test - 持續負載
    - duration: 120
      arrivalRate: 50
      name: "Load test - 50 users/sec"
    # Phase 3: Stress test - 高負載
    - duration: 60
      arrivalRate: 100
      name: "Stress test - 100 users/sec"
    # Phase 4: Cooldown
    - duration: 30
      arrivalRate: 10
      name: "Cooldown - 10 users/sec"
  
  # 效能閾值 (根據 Quality Gate 需求)
  ensure:
    maxErrorRate: 1  # 失敗率 < 1%
    p95: 200        # 95% 請求 < 200ms
    p99: 500        # 99% 請求 < 500ms

  # HTTP 設定
  http:
    timeout: 10
    pool: 50

  # 變數定義
  variables:
    testEmail: "loadtest{{ $randomNumber(1, 10000) }}@example.com"
    testPassword: "LoadTest123!"

scenarios:
  # Scenario 1: 查詢未讀通知數量 (最頻繁的操作)
  - name: "Get Unread Notification Count"
    weight: 40
    flow:
      # 先註冊測試帳號
      - post:
          url: "/api/auth/register"
          json:
            username: "loadtest{{ $randomNumber() }}"
            email: "loadtest{{ $randomNumber() }}@test.com"
            password: "LoadTest123!"
            firstName: "Load"
            lastName: "Test"
          capture:
            - json: "$.token"
              as: "authToken"
      # 查詢未讀通知數量
      - get:
          url: "/api/notifications/unread-count"
          headers:
            Authorization: "Bearer {{ authToken }}"

  # Scenario 2: 獲取通知列表
  - name: "Get Notification List"
    weight: 30
    flow:
      # 註冊測試帳號
      - post:
          url: "/api/auth/register"
          json:
            username: "loadtest{{ $randomNumber() }}"
            email: "loadtest{{ $randomNumber() }}@test.com"
            password: "LoadTest123!"
            firstName: "Load"
            lastName: "Test"
          capture:
            - json: "$.token"
              as: "authToken"
      # 獲取通知列表
      - get:
          url: "/api/notifications?page=1&limit=20"
          headers:
            Authorization: "Bearer {{ authToken }}"

  # Scenario 3: 標記通知為已讀（簡化版：只註冊，因為新用戶沒有通知）
  - name: "Mark Notification as Read"
    weight: 20
    flow:
      # 註冊測試帳號
      - post:
          url: "/api/auth/register"
          json:
            username: "loadtest{{ $randomNumber() }}"
            email: "loadtest{{ $randomNumber() }}@test.com"
            password: "LoadTest123!"
            firstName: "Load"
            lastName: "Test"
          capture:
            - json: "$.token"
              as: "authToken"
      # 檢查通知列表（新用戶應該沒有通知）
      - get:
          url: "/api/notifications?page=1&limit=20"
          headers:
            Authorization: "Bearer {{ authToken }}"

  # Scenario 4: 創建貼文（簡化版，避免依賴現有資料）
  - name: "Create Notification via Comment"
    weight: 10
    flow:
      # 註冊測試帳號
      - post:
          url: "/api/auth/register"
          json:
            username: "loadtest{{ $randomNumber() }}"
            email: "loadtest{{ $randomNumber() }}@test.com"
            password: "LoadTest123!"
            firstName: "Load"
            lastName: "Test"
          capture:
            - json: "$.token"
              as: "authToken"
      # 創建貼文
      - post:
          url: "/api/posts"
          headers:
            Authorization: "Bearer {{ authToken }}"
          json:
            title: "Load test post {{ $randomNumber() }}"
            content: "This is a load test post content for testing notification system performance."
            type: "general"
            category: "general-discussion"
