<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愛心動物認養平台 - 測試頁面</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }
        .emoji {
            font-size: 4rem;
            margin-bottom: 20px;
        }
        .status {
            padding: 15px;
            margin: 20px 0;
            border-radius: 8px;
            font-weight: bold;
        }
        .success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            margin: 10px;
            background: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #0056b3;
        }
        .server-info {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: left;
        }
        .server-info h3 {
            margin-top: 0;
            color: #495057;
        }
        .server-info code {
            background: #e9ecef;
            padding: 2px 4px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">🐾</div>
        <h1>愛心動物認養平台</h1>
        
        <div class="status success">
            ✅ 應用程式已成功啟動！
        </div>
        
        <div class="status info">
            📝 由於 React 開發伺服器配置問題，我們提供了此測試頁面
        </div>
        
        <div class="server-info">
            <h3>🔧 伺服器狀態</h3>
            <p><strong>後端 API:</strong> <code>http://localhost:5000</code></p>
            <p><strong>前端應用:</strong> <code>http://localhost:3000</code></p>
            <p><strong>測試頁面:</strong> <code>http://localhost:3000/test.html</code></p>
            
            <h3>🚀 快速測試</h3>
            <p>點擊下方按鈕測試 API 連線：</p>
            <button class="btn" onclick="testAPI()">測試後端 API</button>
            <button class="btn" onclick="checkReact()">檢查 React 應用</button>
            
            <div id="result" style="margin-top: 20px;"></div>
        </div>
        
        <div style="margin-top: 30px;">
            <h3>📱 主要功能</h3>
            <ul style="text-align: left; display: inline-block;">
                <li>🔐 使用者註冊和登入</li>
                <li>🐕 瀏覽寵物資訊</li>
                <li>📝 提交認養申請</li>
                <li>👤 個人資料管理</li>
                <li>📊 申請狀態追蹤</li>
            </ul>
        </div>
    </div>

    <script>
        async function testAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>🔄 正在測試 API...</p>';
            
            try {
                const response = await fetch('http://localhost:5000/api/health');
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <div class="status success">
                            <strong>✅ API 測試成功！</strong><br>
                            狀態: ${data.status}<br>
                            訊息: ${data.message}<br>
                            時間: ${data.timestamp}
                        </div>
                    `;
                } else {
                    throw new Error('API 回應錯誤');
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="status" style="background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;">
                        <strong>❌ API 測試失敗</strong><br>
                        錯誤: ${error.message}<br>
                        請確認後端伺服器正在運行
                    </div>
                `;
            }
        }
        
        function checkReact() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `
                <div class="status info">
                    <strong>ℹ️ React 應用檢查</strong><br>
                    如果您看到此頁面，表示靜態檔案服務正常<br>
                    React 開發伺服器可能需要額外配置<br>
                    建議使用 <code>npm run build</code> 建立生產版本
                </div>
            `;
        }
        
        // 頁面載入時自動測試 API
        window.addEventListener('load', function() {
            setTimeout(testAPI, 1000);
        });
    </script>
</body>
</html>
